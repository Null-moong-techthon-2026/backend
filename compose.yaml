name: boothrock-dev
services:
  db:
    image: postgres:17
    environment:
      # Public test credentials for the loopback-only development DB, never production.
      POSTGRES_DB: boothrock
      POSTGRES_USER: boothrock_local
      POSTGRES_PASSWORD: 1234
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
volumes:
  postgres-data:
