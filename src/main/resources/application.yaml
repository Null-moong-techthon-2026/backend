spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: boothrock-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: app
    schemas: app
    create-schemas: true
    clean-disabled: true
    validate-migration-naming: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    persist-authorization: false
